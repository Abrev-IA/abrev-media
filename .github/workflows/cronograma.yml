name: Montar cronograma do mês seguinte (dia 12)

# PASSO 00 do ciclo, e o que faltava para o mês seguinte começar sozinho: cria na lista
# "Rascunho" os cartões da pauta do próximo mês, para a rotina de artes (dia 15) achar o
# que gerar e o e-mail de aprovação (dia 20) ter o que mandar para a diretoria.
#
# Roda no dia 12 de propósito: dá três dias de folga antes da rotina de artes. Se este
# disparo falhar, ainda há tempo de rodar na mão sem atrasar o ciclo.
#
# O cockpit exige notas oficiais e parecer A99 antes de devolver a pauta.
on:
  push:
    branches: [main]
    paths:
      - cronograma.mjs
      - .github/workflows/cronograma.yml
  schedule:
    - cron: "0 12 12 * *"   # todo dia 12, 12:00 UTC (~9h BRT)
  workflow_dispatch:
    inputs:
      previa:
        description: "Só mostrar o plano, sem criar cartão"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cronograma-abrev
  cancel-in-progress: false

jobs:
  cronograma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Montar a pauta do mês seguinte
        run: node cronograma.mjs ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.previa)) && '--dry-run' || '' }}
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          COCKPIT_USER: ${{ secrets.COCKPIT_USER }}
          COCKPIT_PASSWORD: ${{ secrets.COCKPIT_PASSWORD }}
