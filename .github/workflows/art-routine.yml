name: Gerar artes do mês (calendário ABREV)

# Do dia 15 ao 20, para cada card do calendário em "Rascunho", aciona a esteira do cockpit
# (art_runner) e anexa as artes aprovadas ao card. Também roda na mão.
#
# Roda todo dia (e não só no 15) porque a cota gratuita da OpenAI é DIÁRIA: 250 mil tokens
# no gpt-4.1, que é o modelo da auditoria visual. A rotina divide as páginas que faltam
# pelos dias restantes até o dia 20 e para quando cumpre o ritmo do dia. Card já pronto é
# pulado, então rodar de novo é seguro e barato.
on:
  schedule:
    - cron: "0 12 15-20 * *"   # todo dia 15 a 20, 12:00 UTC (~9h BRT)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gerar-artes-abrev
  cancel-in-progress: false

jobs:
  gerar-artes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Os reels precisam de ffmpeg (montagem) e puppeteer (camada da ABREV). Sem este
      # passo o lote até roda, mas os cards de reel saem só com a capa.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar e anexar as artes do mês
        run: node art_routine.mjs
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          COCKPIT_BASE: https://abrev-cockpit.administradorabrev.workers.dev
          COCKPIT_USER: ${{ secrets.COCKPIT_USER }}
          COCKPIT_PASSWORD: ${{ secrets.COCKPIT_PASSWORD }}
          # Banco gratuito de footage dos reels. Sem a chave, a arte sai e o reel não.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Ajuste sem mexer no código se o consumo real divergir da estimativa.
          COTA_DIARIA_TOKENS: "250000"
          TOKENS_POR_PAGINA: "15000"
          DIA_ENTREGA: "20"
